<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Field notes — blue travels</title>
    <link rel="stylesheet" href="../styles.css" />
  </head>
  <body><div class="site-shell"><header class="site-header"><a class="wordmark" href="../"><span class="wordmark-mark">↗</span><span>blue travels</span></a><a class="text-link" href="../">Back to map <span>↑</span></a></header><main class="notes-section" style="border-top:0"><div class="section-heading"><div><p class="eyebrow">Field notes</p><h1 style="font:600 clamp(44px,7vw,90px)/.96 var(--serif);letter-spacing:-.06em;margin:0">Dispatches<br /><em style="color:var(--green)">from the road.</em></h1></div></div><div class="post-grid" id="all-posts"></div></main><footer class="site-footer"><span>blue travels</span><span>made for the long way around</span><span>© 2026</span></footer></div><script>
    const target = document.querySelector('#all-posts');
    fetch('index.json').then(r => r.json()).then(posts => { target.innerHTML = posts.map(post => `<article class="post-card"><div><span class="post-tag">${post.place} · ${post.date}</span><h3>${post.title}</h3></div><footer><a href="${post.file}">Read note →</a></footer></article>`).join(''); }).catch(() => { target.innerHTML = '<p class="loading">Notes could not be loaded.</p>'; });
  </script><script src="../app.js"></script></body>
</html>
